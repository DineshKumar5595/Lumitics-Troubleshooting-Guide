<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Lumitics Troubleshooting Hub</title>
  <style>
    body {
      font-family: 'Segoe UI', Arial, sans-serif;
      background-image: url('image_1.png'); 
      background-size: 50% auto; 
      background-position: 100% top; 
      background-repeat: no-repeat; 
      background-attachment: fixed; 
      background-color: #f4f7f9;
      display: flex;
      justify-content: flex-start; 
      padding: 20px; 
      min-height: 100vh; 
      margin: 0;
    }

    .card {
      background: rgba(255, 255, 255, 0.98); 
      padding: 30px; 
      border-radius: 60px; 
      box-shadow: 0 10px 30px rgba(0,0,0,0.15); 
      border: 3px solid #004085; 
      width: 100%;
      max-width: 580px; 
      text-align: center; 
      display: flex;
      flex-direction: column;
      align-items: center;
      margin: auto 0;
      min-height: 700px;
    }

    #display-text {
      width: 85%;
      border: 2px solid #004085;
      border-radius: 20px;
      padding: 25px;
      margin-top: 20px;
      min-height: 160px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1.1rem;
      color: #333;
      line-height: 1.5;
      background-color: #fff;
    }

    #yes-no-area {
      display: flex;
      justify-content: space-around;
      width: 100%;
      margin: 40px 0;
    }
    .oval-btn {
      background: white;
      color: #004085;
      border: 2px solid #004085;
      padding: 18px 40px;
      border-radius: 100px; 
      font-size: 1.1rem;
      font-weight: bold;
      cursor: pointer;
      min-width: 140px;
      transition: all 0.2s;
    }
    .oval-btn:hover { background: #004085; color: white; transform: scale(1.05); }

    .arrow-back {
      background: #f8f9fa;
      color: #004085;
      border: 2px solid #004085;
      padding: 12px 25px 12px 45px;
      font-size: 0.95rem;
      font-weight: bold;
      cursor: pointer;
      margin-bottom: 30px;
      clip-path: polygon(15% 0%, 100% 0%, 100% 100%, 15% 100%, 0% 50%);
    }

    .home-container {
      border: 2px solid #004085;
      border-radius: 20px;
      padding: 10px;
      cursor: pointer;
      width: 80px;
    }
    .home-icon { font-size: 40px; display: block; }
    .home-text { font-size: 11px; font-weight: bold; color: #004085;}

    #searchBar { width: 95%; padding: 15px; font-size: 1rem; margin-bottom: 20px; border: 2px solid #004085; border-radius: 12px; }
    .menu-btn { display: block; width: 95%; margin: 12px auto; background-color: #004085; color: white; padding: 18px; border-radius: 12px; text-align: left; border: none; cursor: pointer; font-size: 1rem; }
  </style>
</head>
<body>

  <div class="card">
    <div id="menu-screen" style="width: 100%;">
      <h2 style="color:#004085">Lumitics Support Hub</h2> 
      <input type="text" id="searchBar" onkeyup="filterIssues()" placeholder="Search symptoms..."> 
      <div id="issue-list">
        <button class="menu-btn" onclick="startDiagnostic('rfid_start')">💳 RFID Card Not Detected</button> 
        <button class="menu-btn" onclick="startDiagnostic('data_start')">📡 Not Receiving Data</button> 
        <button class="menu-btn" onclick="startDiagnostic('power_start')">🔌 Device Not Turning On</button> 
        <button class="menu-btn" onclick="startDiagnostic('led_start')">🔴 LED Blinking Red</button> 
      </div>
    </div>

    <div id="diagnostic-screen" style="display: none; flex-direction: column; align-items: center; width: 100%;"> 
      <div id="display-text"></div> 
      <div id="yes-no-area">
        <button class="oval-btn" id="yes-btn" onclick="makeChoice('Yes')">Yes</button> 
        <button class="oval-btn" id="no-btn" onclick="makeChoice('No')">No</button> 
      </div>
      <button id="back-btn" class="arrow-back" onclick="goBack()">Back to Previous Step</button>
      <div class="home-container" onclick="goToMenu()">
        <span class="home-text">HOME</span>
        <span class="home-icon">🏠</span>
      </div>
    </div>
  </div>

  <script>
    const logicTree = {
      // RFID LOGIC: INDIVIDUAL PROCESSES 
      "rfid_start": { type: "question", text: "Is the device flashing green now? ", yesNext: "rf_tap_diff", noNext: "rf_no_fg" },
      "rf_tap_diff": { type: "question", text: "Please tap a different card on the reader. ", yesNext: "rf_detect_diff", noNext: "rf_detect_diff" },
      "rf_detect_diff": { type: "question", text: "Did the device detect another card? ", yesNext: "rf_flash_gr_rd", noNext: "rf_cont_fg_q" },
      "rf_cont_fg_q": { type: "question", text: "Does the device continue to flash green, or is there no light at all? ", yesText: "Flashing Green", yesNext: "rf_fg_escalate", noText: "No light", noNext: "rf_no_light_res" },
      "rf_fg_escalate": { type: "question", text: "The LED is flashing green. Please ask for their availability and contact details. Escalate this issue to the hardware team. ", yesNext: "tech_support_res", noNext: "tech_support_res" },
      "rf_no_light_res": { type: "question", text: "Go to device not turning on. ", yesNext: "power_start", noNext: "power_start" },
      
      "rf_flash_gr_rd": { type: "question", text: "Did the device's LED flash green and red when you tapped the card? ", yesNext: "rf_try_new_card", noNext: "rf_check_led_cond" },
      "rf_check_led_cond": { type: "question", text: "What is the condition of the LED now? ", yesText: "Solid Green", yesNext: "rf_solid_gr_imm", noText: "Flashing Red", noNext: "rf_red_jump" },
      "rf_red_jump": { type: "question", text: "Go to LED Blinking Red. ", yesNext: "led_start", noNext: "led_start" },
      
      "rf_solid_gr_imm": { type: "question", text: "Did the LED change to solid green immediately after starting the device? ", yesNext: "rf_get_id_op", noNext: "rf_tapped_other" },
      "rf_tapped_other": { type: "question", text: "Did you tap other card? ", yesNext: "rf_restart_dev", noNext: "rf_escalate_hw_now" },
      "rf_escalate_hw_now": { type: "question", text: "Please ask for their availability and contact details. Escalate this issue to the hardware team. ", yesNext: "tech_support_res", noNext: "tech_support_res" },

      "rf_try_new_card": { type: "question", text: "Did you try tapping a new card? ", yesNext: "rf_service_replace_q", noNext: "rf_used_before_q" },
      "rf_used_before_q": { type: "question", text: "Have you used this card before? ", yesNext: "rf_get_id_op", noNext: "rf_service_replace_q" },
      "rf_service_replace_q": { type: "question", text: "Are you starting a new service, or are you replacing a lost card? ", yesText: "Replacement", yesNext: "rf_req_id_num", noText: "New Service", noNext: "rf_inform_cs_q" },
      "rf_req_id_num": { type: "question", text: "Please let me know the Device ID and the RFID card number. ", yesNext: "rf_leave_on_5", noNext: "rf_leave_on_5" },
      "rf_leave_on_5": { type: "question", text: "Please leave the device on for five minutes while we update it. ", yesNext: "rf_cs_inform_hw", noNext: "rf_cs_inform_hw" },
      "rf_cs_inform_hw": { type: "question", text: "CS: Please inform the hardware team to update the RFID card number. ", yesNext: "rf_test_card_req", noNext: "rf_test_card_req" },
      "rf_test_card_req": { type: "question", text: "Once the hardware team updates the device, please ask the client to test the card. ", yesNext: "rf_able_to_use_q", noNext: "rf_able_to_use_q" },
      "rf_able_to_use_q": { type: "question", text: "Was the client able to use the new card? ", yesNext: "rf_inform_notify_first", noNext: "rf_led_after_upd_q" },
      "rf_inform_notify_first": { type: "resolution", text: "Please inform the client that if they want to use a new card, they must notify us first. " },
      "rf_led_after_upd_q": { type: "question", text: "Is the device LED blinking green and red now, or is it just flashing green? ", yesText: "Green & Red", yesNext: "rf_check_time_tied", noText: "Flashing Green", noNext: "rf_restart_dev" },
      "rf_check_time_tied": { type: "question", text: "Is this card tied to a time-based operation? CS: Verify the RFID type in the Unit Tracker. ", yesNext: "rf_is_time_tied_final", noNext: "rf_restart_dev" },
      "rf_is_time_tied_final": { type: "question", text: "Is the updated service time-tied? ", yesNext: "rf_allocated_window_res", noNext: "rf_restart_dev" },
      "rf_allocated_window_res": { type: "resolution", text: "Please inform the client that they can start using the card within the allocated time window. " },
      
      "rf_restart_dev": { type: "question", text: "Please restart the device. ", yesNext: "rf_able_to_tap_q", noNext: "rf_able_to_tap_q" },
      "rf_able_to_tap_q": { type: "question", text: "Are you able to tap the card now? ", yesNext: "rf_ready_res", noNext: "rf_try_diff_card" },
      "rf_try_diff_card": { type: "question", text: "Could you please try a different card? Does it work? ", yesNext: "rf_ready_res", noNext: "rf_card_num_correct_q" },
      "rf_card_num_correct_q": { type: "question", text: "Is the card number provided correct? CS: Ask for picture. ", yesText: "Correct", yesNext: "rf_ask_avail_hw", noText: "No", noNext: "rf_req_id_num" },
      "rf_ask_avail_hw": { type: "question", text: "Please ask for their availability and contact details. Escalate this issue to the hardware team. ", yesNext: "tech_support_res", noNext: "tech_support_res" },
      "rf_ready_res": { type: "resolution", text: "The device is ready for operation now. " },

      "rf_inform_cs_q": { type: "question", text: "Have you informed CS about starting the new service? ", yesNext: "rf_req_id_num", noNext: "rf_need_service_details" },
      "rf_need_service_details": { type: "question", text: "I need the following service details: Service Name and Operation Time. ", yesNext: "rf_manager_check", noNext: "rf_manager_check" },
      "rf_manager_check": { type: "resolution", text: "We will check with your account manager and get back to you. " },

      "rf_get_id_op": { type: "question", text: "Please let me know the Device ID, and we will check its operation type. ", yesNext: "rf_op_type_q", noNext: "rf_op_type_q" },
      "rf_op_type_q": { type: "question", text: "What is the operation type of this device? ", yesText: "RFID Only", yesNext: "rf_req_card_num", noText: "Other", noNext: "rf_other_op_q" },
      "rf_req_card_num": { type: "question", text: "What is the card number? ", yesNext: "rf_check_hw_team", noNext: "rf_check_hw_team" },
      "rf_check_hw_team": { type: "question", text: "Check the card number with the hardware team. ", yesNext: "rf_hw_num_config_q", noNext: "rf_hw_num_config_q" },
      "rf_hw_num_config_q": { type: "question", text: "Is the card number configured on the device? ", yesNext: "rf_restart_dev", noNext: "rf_not_in_sys_res" },
      "rf_not_in_sys_res": { type: "question", text: "The card number is not in the system. Please let me know the Device ID and the RFID card number. ", yesNext: "rf_req_id_num", noNext: "rf_req_id_num" },
      
      "rf_other_op_q": { type: "question", text: "Is the operation type: Time based, Card-Time based, or No card? ", yesText: "Time/No Card", yesNext: "rf_solid_gr_starting_q", noText: "Card-Time", noNext: "rf_window_notice_act" },
      "rf_solid_gr_starting_q": { type: "question", text: "Does the machine's LED show solid green when starting the device? ", yesNext: "rf_auto_trigger_res", noNext: "tech_support_res" },
      "rf_auto_trigger_res": { type: "resolution", text: "There is no need to tap the card. The machine will automatically trigger the service. " },
      "rf_window_notice_act": { type: "question", text: "The device is set to operate within a certain time window. You need to follow that schedule when tapping the card. ", yesNext: "rf_change_time_q", noNext: "rf_change_time_q" },
      "rf_change_time_q": { type: "question", text: "Do you want to change the operation time? ", yesNext: "rf_cs_get_time", noNext: "rf_follow_allocated" },
      "rf_cs_get_time": { type: "resolution", text: "CS: Please get the time and inform the hardware team. " },
      "rf_follow_allocated": { type: "resolution", text: "Please use the device based on the allocated time. " },

      "rf_no_fg": { type: "question", text: "What is the LED status now? ", yesText: "Solid Green", yesNext: "rf_press_gr_act", noText: "No", noNext: "rf_no_fg_final_q" },
      "rf_no_fg_final_q": { type: "question", text: "What is the condition of the LED now? ", yesText: "Solid Green", yesNext: "rf_solid_gr_imm", noText: "No Light", noNext: "rf_no_light_res" },
      "rf_press_gr_act": { type: "question", text: "Solid Green. Please press the green button. ", yesNext: "rf_bucket_move_q", noNext: "rf_bucket_move_q" },
      "rf_bucket_move_q": { type: "question", text: "Did the weight bucket move? ", yesNext: "rf_restart_dev_check", noNext: "rf_restart_dev" },
      "rf_restart_dev_check": { type: "question", text: "Did the device flash green after restarting? ", yesNext: "rf_tap_card_final_act", noNext: "rf_check_led_cond" },
      "rf_tap_card_final_act": { type: "question", text: "Please tap the card now. ", yesNext: "rf_led_chg_solid_q", noNext: "rf_led_chg_solid_q" },
      "rf_led_chg_solid_q": { type: "question", text: "Did the LED change from flashing to solid green? ", yesNext: "rf_ready_res", noNext: "rf_tap_diff" },

      // Previous Logic 
      "data_start": { type: "question", text: "When was last data received?", yesText: "Yesterday", yesNext: "d_used_today", noText: "1 Week Ago", noNext: "power_start" },
      "power_start": { type: "question", text: "Is the charger plugged in and showing RED?", yesNext: "p_id_check", noNext: "tech_support_res" },
      "led_start": { type: "question", text: "Is the weight bucket attached?", yesNext: "l_clear_food", noNext: "tech_support_res" },
      "tech_support_res": { type: "resolution", text: "Resolution:<br>Escalate to technical team. Please provide contact details and availability." }
    };

    let currentNode = ""; 
    let history = []; 

    function startDiagnostic(startNodeId) {
      document.getElementById("menu-screen").style.display = "none"; 
      document.getElementById("diagnostic-screen").style.display = "flex"; 
      currentNode = startNodeId; 
      history = []; 
      updateScreen(); 
    }

    function goToMenu() {
      document.getElementById("menu-screen").style.display = "block"; 
      document.getElementById("diagnostic-screen").style.display = "none"; 
      document.getElementById("searchBar").value = ""; 
      filterIssues(); 
    }

    function updateScreen() {
      const node = logicTree[currentNode]; 
      const textBox = document.getElementById("display-text"); 
      const yesNoArea = document.getElementById("yes-no-area"); 
      const backBtn = document.getElementById("back-btn");
      const yesBtn = document.getElementById("yes-btn");
      const noBtn = document.getElementById("no-btn");

      textBox.innerHTML = node.text; 
      yesBtn.innerText = node.yesText || "Yes";
      noBtn.innerText = node.noText || "No";
      backBtn.style.visibility = (history.length > 0) ? "visible" : "hidden";

      if (node.type === "resolution") {
        textBox.style.borderColor = "#28a745"; 
        textBox.style.color = "#28a745";
        yesNoArea.style.display = "none";      
      } else {
        textBox.style.borderColor = "#004085";
        textBox.style.color = "#333";
        yesNoArea.style.display = "block";     
      }
    }

    function makeChoice(answer) {
      history.push(currentNode); 
      currentNode = answer === 'Yes' ? logicTree[currentNode].yesNext : logicTree[currentNode].noNext; 
      updateScreen(); 
    }

    function goBack() {
      if (history.length > 0) {
        currentNode = history.pop(); 
        updateScreen();
      }
    }

    function filterIssues() {
      const input = document.getElementById('searchBar').value.toLowerCase(); 
      const buttons = document.getElementById('issue-list').getElementsByTagName('button'); 
      for (let i = 0; i < buttons.length; i++) {
        const btnText = buttons[i].innerText.toLowerCase(); 
        buttons[i].style.display = btnText.includes(input) ? "block" : "none";
      }
    }
  </script>
</body>
</html>
