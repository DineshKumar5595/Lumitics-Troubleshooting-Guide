<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Lumitics Troubleshooting Hub</title>
  <style>
    body {
      font-family: 'Segoe UI', Arial, sans-serif;
      background-image: url('image_1.png'); 
      background-size: 50% auto; 
      background-position: 100% top; 
      background-repeat: no-repeat; 
      background-attachment: fixed; 
      background-color: #f4f7f9;
      display: flex;
      justify-content: flex-start; 
      padding: 20px; 
      min-height: 100vh; 
      margin: 0;
    }

    /* Sketch-based Card Design */
    .card {
      background: rgba(255, 255, 255, 0.98); 
      padding: 30px; 
      border-radius: 60px; 
      box-shadow: 0 10px 30px rgba(0,0,0,0.15); 
      border: 3px solid #004085; 
      width: 100%;
      max-width: 550px; 
      text-align: center; 
      display: flex;
      flex-direction: column;
      align-items: center;
      margin: auto 0;
      min-height: 600px;
    }

    .step-header {
      font-size: 14px;
      color: #004085;
      font-weight: bold;
      margin-bottom: 5px;
      text-transform: uppercase;
    }

    /* Question Box */
    #display-text {
      width: 85%;
      border: 2px solid #004085;
      border-radius: 20px;
      padding: 25px;
      min-height: 120px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1.15rem;
      color: #333;
      line-height: 1.4;
      background-color: #fff;
    }

    /* Oval Action Buttons */
    #yes-no-area {
      display: flex;
      justify-content: space-around;
      width: 100%;
      margin: 50px 0;
    }
    .oval-btn {
      background: white;
      color: #004085;
      border: 2px solid #004085;
      padding: 18px 45px;
      border-radius: 100px; 
      font-size: 1.1rem;
      font-weight: bold;
      cursor: pointer;
      min-width: 140px;
      transition: all 0.2s;
    }
    .oval-btn:hover { background: #004085; color: white; transform: scale(1.05); }

    /* Arrow Back Button */
    .arrow-back {
      background: #f8f9fa;
      color: #004085;
      border: 2px solid #004085;
      padding: 10px 25px 10px 45px;
      font-size: 0.9rem;
      font-weight: bold;
      cursor: pointer;
      margin-bottom: 30px;
      clip-path: polygon(15% 0%, 100% 0%, 100% 100%, 15% 100%, 0% 50%);
    }

    /* Home Button Icon */
    .home-container {
      border: 2px solid #004085;
      border-radius: 20px;
      padding: 10px;
      cursor: pointer;
      width: 80px;
    }
    .home-icon { font-size: 40px; display: block; }
    .home-text { font-size: 11px; font-weight: bold; color: #004085;}

    /* Menu Styling */
    #searchBar { width: 95%; padding: 15px; font-size: 1rem; margin-bottom: 20px; border: 2px solid #004085; border-radius: 12px; }
    .menu-btn { display: block; width: 95%; margin: 12px auto; background-color: #004085; color: white; padding: 18px; border-radius: 12px; text-align: left; border: none; cursor: pointer; font-size: 1rem; }
    
    @media (max-width: 768px) {
      body { background-image: none; justify-content: center; padding: 10px; }
      .card { border-radius: 40px; }
    }
  </style>
</head>
<body>

  <div class="card">
    <div id="menu-screen" style="width: 100%;">
      <h2 style="color:#004085">Lumitics Support Hub</h2> 
      <input type="text" id="searchBar" onkeyup="filterIssues()" placeholder="Search symptoms..."> 
      <div id="issue-list">
        <button class="menu-btn" onclick="startDiagnostic('rfid_start')">💳 RFID Card Not Detected</button> 
        <button class="menu-btn" onclick="startDiagnostic('data_start')">📡 Not Receiving Data</button> 
        <button class="menu-btn" onclick="startDiagnostic('power_start')">🔌 Device Not Turning On</button> 
        <button class="menu-btn" onclick="startDiagnostic('led_start')">🔴 LED Blinking Red</button> 
      </div>
    </div>

    <div id="diagnostic-screen" style="display: none; flex-direction: column; align-items: center; width: 100%;"> 
      <div class="step-header">Current Diagnostic Step</div>
      <div id="display-text"></div> 
      
      <div id="yes-no-area">
        <button class="oval-btn" id="yes-btn" onclick="makeChoice('Yes')">Yes</button> 
        <button class="oval-btn" id="no-btn" onclick="makeChoice('No')">No</button> 
      </div>

      <button id="back-btn" class="arrow-back" onclick="goBack()">Back to Previous Step</button>

      <div class="home-container" onclick="goToMenu()">
        <span class="home-text">HOME</span>
        <span class="home-icon">🏠</span>
      </div>
    </div>
  </div>

  <script>
    const logicTree = {
      /* UPDATED RFID LOGIC [cite: 1] */
      "rfid_start": { type: "question", text: "Is the device flashing green now? [cite: 221]", yesNext: "rf_tap_diff", noNext: "rf_check_led_status" },
      "rf_tap_diff": { type: "question", text: "Please tap a different card on the reader. [cite: 240] <br><br> Did the device detect it? [cite: 9]", yesNext: "rf_led_flash_check", noNext: "rf_cont_flash" },
      "rf_cont_flash": { type: "question", text: "Does the device continue to flash green, or is there no light at all? [cite: 237]", yesText: "Flashing Green", yesNext: "tech_support_res", noText: "No Light", noNext: "power_start" },
      
      "rf_led_flash_check": { type: "question", text: "Did the LED flash green and red when you tapped the card? [cite: 14]", yesNext: "rf_new_or_replacement", noNext: "rf_led_condition" },
      "rf_led_condition": { type: "question", text: "What is the condition of the LED now? [cite: 225]", yesText: "Solid Green", yesNext: "rf_solid_green_check", noText: "Flashing Red", noNext: "led_start" },
      "rf_solid_green_check": { type: "question", text: "Did the LED change to solid green immediately after starting? [cite: 229]", yesNext: "rf_get_device_id", noNext: "rf_tap_other" },
      "rf_tap_other": { type: "question", text: "Did you tap another card? [cite: 233]", yesNext: "rf_restart_device", noNext: "tech_support_res" },
      
      "rf_new_or_replacement": { type: "question", text: "Are you starting a new service, or is this a replacement for a lost card? [cite: 25]", yesText: "Replacement", yesNext: "rf_get_id_card", noText: "New Service", noNext: "rf_start_new_service" },
      "rf_get_id_card": { type: "question", text: "Please provide Device ID and RFID number. [cite: 30] <br><br> CS: Inform hardware team to update. [cite: 35] <br><br> Was the client able to use the new card? [cite: 41]", yesNext: "rf_success_res", noNext: "rf_led_after_update" },
      "rf_led_after_update": { type: "question", text: "Is the LED flashing green and red, or just flashing green? [cite: 50]", yesText: "Green & Red", yesNext: "rf_check_time_tied", noText: "Flashing Green", noNext: "rf_restart_device" },
      "rf_check_time_tied": { type: "question", text: "Is this card tied to a time-based operation? [cite: 55] <br><br> Verify RFID type in Tracker. Is it time-tied? [cite: 59]", yesNext: "rf_time_window_res", noNext: "rf_restart_device" },
      
      "rf_restart_device": { type: "question", text: "Please restart the device. [cite: 66] <br><br> Are you able to tap the card now? [cite: 69]", yesNext: "rf_ready_res", noNext: "rf_try_different" },
      "rf_try_different": { type: "question", text: "Could you please try a different card? Does it work? [cite: 78]", yesNext: "rf_ready_res", noNext: "rf_num_correct" },
      "rf_num_correct": { type: "question", text: "Is the card number provided correct? CS: Verify with picture. [cite: 84]", yesNext: "rf_escalate_hw", noNext: "rf_get_id_card" },
      
      "rf_start_new_service": { type: "question", text: "Starting a new service. [cite: 146] <br><br> Have you informed CS about starting the new service? [cite: 149]", yesNext: "rf_get_id_card", noNext: "rf_need_details" },
      "rf_need_details": { type: "resolution", text: "We need Service Name and Operation Time. [cite: 155] We will check with the account manager and get back to you. [cite: 157]" },

      "rf_get_device_id": { type: "question", text: "Please provide the Device ID to check operation type. [cite: 166] <br><br> Is it RFID only? [cite: 174]", yesNext: "rf_hw_config", noNext: "rf_check_time_based" },
      "rf_hw_config": { type: "question", text: "Check card number with hardware team. [cite: 184] <br><br> Is it configured on the device? [cite: 187]", yesNext: "rf_restart_device", noNext: "rf_not_in_system" },
      "rf_check_time_based": { type: "question", text: "Is the operation Time-based? [cite: 176]", yesNext: "rf_automatic_trigger", noNext: "rf_check_card_time" },
      "rf_automatic_trigger": { type: "resolution", text: "No need to tap. Machine triggers automatically based on schedule. [cite: 194, 201]" },
      "rf_check_card_time": { type: "question", text: "Is it Card-Time based? [cite: 178] <br><br> Do you want to change the operation time? [cite: 207]", yesNext: "rf_cs_get_time", noNext: "rf_follow_schedule" },
      
      "rf_check_led_status": { type: "question", text: "What is the LED status now? [cite: 257] <br><br> Is it Solid Green? [cite: 259]", yesNext: "rf_press_green_btn", noNext: "power_start" },
      "rf_press_green_btn": { type: "question", text: "Please press the green button. [cite: 261] <br><br> Did the weight bucket move? [cite: 264]", yesNext: "rf_restart_check", noNext: "rf_restart_device" },
      "rf_restart_check": { type: "question", text: "Did the device flash green after restarting? [cite: 271]", yesNext: "rf_tap_after_restart", noNext: "rf_led_condition" },
      "rf_tap_after_restart": { type: "question", text: "Please tap the card now. [cite: 277] <br><br> Did LED change from flashing to solid green? [cite: 280]", yesNext: "rf_ready_res", noNext: "rf_tap_diff" },

      "rf_success_res": { type: "resolution", text: "Please inform the client to notify us first before using new cards. [cite: 44]" },
      "rf_ready_res": { type: "resolution", text: "The machine is now ready for operation. [cite: 72, 283]" },
      "rf_time_window_res": { type: "resolution", text: "Client can only use the card within the allocated time window. [cite: 62]" },
      "rf_follow_schedule": { type: "resolution", text: "Please use the device based on the allocated time. [cite: 213]" },
      "rf_cs_get_time": { type: "resolution", text: "CS: Please get the time and inform hardware team. [cite: 210]" },
      "rf_not_in_system": { type: "resolution", text: "Card number is not in the system. [cite: 193]" },
      "rf_escalate_hw": { type: "resolution", text: "Escalating issue to hardware team. [cite: 90]" },

      /* PREVIOUS SHARED LOGIC */
      "data_start": { type: "question", text: "When was last data received?", yesText: "Yesterday", yesNext: "d_used_today", noText: "1 Week Ago", noNext: "power_start" },
      "d_used_today": { type: "question", text: "Did client use device today?", yesNext: "d_wait_hour", noNext: "tech_support_res" },
      "d_wait_hour": { type: "question", text: "Leave on for 1 hour. Data received?", yesNext: "d_slow_net", noNext: "tech_support_res" },
      "d_slow_net": { type: "resolution", text: "Slow network. Leave on 30 mins after service." },
      "power_start": { type: "question", text: "Is the charger showing RED?", yesNext: "p_id_check", noNext: "tech_support_res" },
      "p_id_check": { type: "question", text: "Is ID V0501?", yesNext: "p_boot_wait", noNext: "p_boot_wait" },
      "p_boot_wait": { type: "question", text: "Restart and wait 1 min. LED Flashing Green?", yesNext: "d_resolved", noNext: "led_start" },
      "led_start": { type: "question", text: "Is weight bucket attached?", yesNext: "l_clear_food", noNext: "tech_support_res" },
      "l_clear_food": { type: "question", text: "Is there food in bucket?", yesNext: "l_clear_res", noNext: "tech_support_res" },
      "l_clear_res": { type: "resolution", text: "Clear food waste and restart." },
      "d_resolved": { type: "resolution", text: "Success! The device is now ready for use." },
      "tech_support_res": { type: "resolution", text: "Resolution:<br>Escalate to technical team. Please provide contact details." }
    };

    let currentNode = ""; 
    let history = []; 

    function startDiagnostic(startNodeId) {
      document.getElementById("menu-screen").style.display = "none"; 
      document.getElementById("diagnostic-screen").style.display = "flex"; 
      currentNode = startNodeId; 
      history = []; 
      updateScreen(); 
    }

    function goToMenu() {
      document.getElementById("menu-screen").style.display = "block"; 
      document.getElementById("diagnostic-screen").style.display = "none"; 
      document.getElementById("searchBar").value = ""; 
      filterIssues(); 
    }

    function updateScreen() {
      const node = logicTree[currentNode]; 
      const textBox = document.getElementById("display-text"); 
      const yesNoArea = document.getElementById("yes-no-area"); 
      const backBtn = document.getElementById("back-btn");
      const yesBtn = document.getElementById("yes-btn");
      const noBtn = document.getElementById("no-btn");

      textBox.innerHTML = node.text; 
      yesBtn.innerText = node.yesText || "Yes";
      noBtn.innerText = node.noText || "No";
      backBtn.style.visibility = (history.length > 0) ? "visible" : "hidden";

      if (node.type === "resolution") {
        textBox.style.borderColor = "#28a745"; 
        textBox.style.color = "#28a745";
        yesNoArea.style.display = "none";      
      } else {
        textBox.style.borderColor = "#004085";
        textBox.style.color = "#333";
        yesNoArea.style.display = "block";     
      }
    }

    function makeChoice(answer) {
      history.push(currentNode); 
      currentNode = answer === 'Yes' ? logicTree[currentNode].yesNext : logicTree[currentNode].noNext; 
      updateScreen(); 
    }

    function goBack() {
      if (history.length > 0) {
        currentNode = history.pop(); 
        updateScreen();
      }
    }

    function filterIssues() {
      const input = document.getElementById('searchBar').value.toLowerCase(); 
      const buttons = document.getElementById('issue-list').getElementsByTagName('button'); 
      for (let i = 0; i < buttons.length; i++) {
        const btnText = buttons[i].innerText.toLowerCase(); 
        buttons[i].style.display = btnText.includes(input) ? "block" : "none";
      }
    }
  </script>
</body>
</html>
