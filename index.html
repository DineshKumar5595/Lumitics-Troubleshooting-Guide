<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Lumitics Troubleshooting Hub</title>
  <style>
    body {
      font-family: 'Segoe UI', Arial, sans-serif;
      background-image: url('image_1.png'); 
      background-size: 50% auto; 
      background-position: 100% top; 
      background-repeat: no-repeat; 
      background-attachment: fixed; 
      background-color: #f4f7f9;
      display: flex;
      justify-content: flex-start; 
      padding: 20px; 
      min-height: 100vh; 
      margin: 0;
    }

    /* Interactive Card */
    .card {
      background: rgba(255, 255, 255, 0.98); 
      padding: 30px; 
      border-radius: 60px; 
      box-shadow: 0 10px 30px rgba(0,0,0,0.15); 
      border: 3px solid #004085; 
      width: 100%;
      max-width: 580px; 
      text-align: center; 
      display: flex;
      flex-direction: column;
      align-items: center;
      margin: auto 0;
      min-height: 700px;
    }

    .step-header {
      font-size: 14px;
      color: #004085;
      font-weight: bold;
      margin-bottom: 5px;
      text-transform: uppercase;
    }

    /* Question Box */
    #display-text {
      width: 85%;
      border: 2px solid #004085;
      border-radius: 20px;
      padding: 25px;
      margin-top: 10px;
      min-height: 160px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1.1rem;
      color: #333;
      line-height: 1.5;
      background-color: #fff;
    }

    /* Oval Action Buttons */
    #yes-no-area {
      display: flex;
      justify-content: space-around;
      width: 100%;
      margin: 40px 0;
    }
    .oval-btn {
      background: white;
      color: #004085;
      border: 2px solid #004085;
      padding: 18px 40px;
      border-radius: 100px; 
      font-size: 1.1rem;
      font-weight: bold;
      cursor: pointer;
      min-width: 140px;
      transition: all 0.2s;
    }
    .oval-btn:hover { background: #004085; color: white; transform: scale(1.05); }

    /* Arrow Back Button */
    .arrow-back {
      background: #f8f9fa;
      color: #004085;
      border: 2px solid #004085;
      padding: 12px 25px 12px 45px;
      font-size: 0.95rem;
      font-weight: bold;
      cursor: pointer;
      margin-bottom: 30px;
      clip-path: polygon(15% 0%, 100% 0%, 100% 100%, 15% 100%, 0% 50%);
    }

    /* Home Button Icon */
    .home-container {
      border: 2px solid #004085;
      border-radius: 20px;
      padding: 10px;
      cursor: pointer;
      width: 80px;
    }
    .home-icon { font-size: 40px; display: block; }
    .home-text { font-size: 11px; font-weight: bold; color: #004085;}

    /* Menu Styling */
    #searchBar { width: 95%; padding: 15px; font-size: 1rem; margin-bottom: 20px; border: 2px solid #004085; border-radius: 12px; }
    .menu-btn { display: block; width: 95%; margin: 12px auto; background-color: #004085; color: white; padding: 18px; border-radius: 12px; text-align: left; border: none; cursor: pointer; font-size: 1rem; }
  </style>
</head>
<body>

  <div class="card">
    <div id="menu-screen" style="width: 100%;">
      <h2 style="color:#004085">Lumitics Support Hub</h2> 
      <input type="text" id="searchBar" onkeyup="filterIssues()" placeholder="Search symptoms..."> 
      <div id="issue-list">
        <button class="menu-btn" onclick="startDiagnostic('rfid_start')">💳 RFID Card Not Detected</button> 
        <button class="menu-btn" onclick="startDiagnostic('data_start')">📡 Not Receiving Data</button> 
        <button class="menu-btn" onclick="startDiagnostic('power_start')">🔌 Device Not Turning On</button> 
        <button class="menu-btn" onclick="startDiagnostic('led_start')">🔴 LED Blinking Red</button> 
      </div>
    </div>

    <div id="diagnostic-screen" style="display: none; flex-direction: column; align-items: center; width: 100%;"> 
      <div class="step-header">Current Diagnostic Step</div>
      <div id="display-text"></div> 
      
      <div id="yes-no-area">
        <button class="oval-btn" id="yes-btn" onclick="makeChoice('Yes')">Yes</button> 
        <button class="oval-btn" id="no-btn" onclick="makeChoice('No')">No</button> 
      </div>

      <button id="back-btn" class="arrow-back" onclick="goBack()">Back to Previous Step</button>

      <div class="home-container" onclick="goToMenu()">
        <span class="home-text">HOME</span>
        <span class="home-icon">🏠</span>
      </div>
    </div>
  </div>

  <script>
    const logicTree = {
      /* FULL RFID LOGIC  */
      "rfid_start": { type: "question", text: "Is the device flashing green now?", yesNext: "rf_tap_diff", noNext: "rf_check_no" },
      "rf_tap_diff": { type: "question", text: "Please tap a different card on the reader. <br><br> Did the device detect another card?", yesNext: "rf_led_flash_check", noNext: "rf_cont_flash" },
      "rf_cont_flash": { type: "question", text: "Does the device continue to flash green, or is there no light at all?", yesText: "Flashing Green", yesNext: "rf_fg_escalate", noText: "No light", noNext: "rf_no_light_jump" },
      "rf_fg_escalate": { type: "question", text: "The LED is flashing green. <br><br> Please ask for their availability and contact details. Escalate this issue to the hardware team.", yesNext: "tech_support_res", noNext: "tech_support_res" },
      "rf_no_light_jump": { type: "question", text: "No light. <br><br> Go to device not turning on.", yesNext: "power_start", noNext: "power_start" },
      
      "rf_led_flash_check": { type: "question", text: "Did the device's LED flash green and red when you tapped the card?", yesNext: "rf_new_card_q", noNext: "rf_led_condition" },
      "rf_led_condition": { type: "question", text: "What is the condition of the LED now?", yesText: "Solid Green", yesNext: "rf_solid_green_branch", noText: "Flashing Red", noNext: "rf_red_jump" },
      "rf_red_jump": { type: "question", text: "Flashing Red. <br><br> Go to LED Blinking Red.", yesNext: "led_start", noNext: "led_start" },
      
      "rf_solid_green_branch": { type: "question", text: "Did the LED change to solid green immediately after starting the device?", yesNext: "rf_check_operation", noNext: "rf_tap_other_card" },
      "rf_tap_other_card": { type: "question", text: "Did you tap other card?", yesNext: "rf_restart_now", noNext: "rf_no_tap_other" },
      "rf_no_tap_other": { type: "question", text: "No. <br><br> Please ask for their availability and contact details. Escalate this issue to the hardware team.", yesNext: "tech_support_res", noNext: "tech_support_res" },

      "rf_new_card_q": { type: "question", text: "Did you try tapping a new card?", yesNext: "rf_new_service_q", noNext: "rf_used_before_q" },
      "rf_used_before_q": { type: "question", text: "Have you used this card before?", yesNext: "rf_check_operation", noNext: "rf_new_service_q" },
      "rf_new_service_q": { type: "question", text: "Are you starting a new service, or are you replacing a lost card?", yesText: "Lost Card", yesNext: "rf_id_number_req", noText: "New Service", noNext: "rf_start_new_service" },
      "rf_id_number_req": { type: "question", text: "Please let me know the Device ID and the RFID card number. <br><br> Please leave the device on for five minutes while we update it. <br><br> CS: Please inform the hardware team to update the RFID card number. <br><br> Was the client able to use the new card?", yesNext: "rf_inform_success", noNext: "rf_led_after_update" },
      "rf_inform_success": { type: "resolution", text: "Please inform the client that if they want to use a new card, they must notify us first." },
      "rf_led_after_update": { type: "question", text: "Is the device LED blinking green and red now, or is it just flashing green?", yesText: "Green & Red", yesNext: "rf_time_tied_tracker", noText: "Flashing Green", noNext: "rf_restart_now" },
      "rf_time_tied_tracker": { type: "question", text: "Is this card tied to a time-based operation? <br><br> CS: Please verify the RFID type in the Unit Tracker. <br><br> Is the updated service time-tied?", yesNext: "rf_allocated_window", noNext: "rf_restart_now" },
      "rf_allocated_window": { type: "resolution", text: "Please inform the client that they can start using the card within the allocated time window." },
      
      "rf_restart_now": { type: "question", text: "Please restart the device. <br><br> Are you able to tap the card now?", yesNext: "rf_ready_op", noNext: "rf_try_different_card" },
      "rf_try_different_card": { type: "question", text: "Could you please try a different card? Does it work?", yesNext: "rf_ready_op", noNext: "rf_correct_number_q" },
      "rf_correct_number_q": { type: "question", text: "Is the card number provided correct? <br><br> CS: Please ask the client to send a picture of the card clearly showing the number.", yesText: "Correct", yesNext: "rf_avail_details", noText: "Wrong", noNext: "rf_id_number_req" },
      "rf_avail_details": { type: "question", text: "Card number is correct. <br><br> Please ask for their availability and contact details. <br><br> Escalate this issue to the hardware team.", yesNext: "tech_support_res", noNext: "tech_support_res" },
      "rf_ready_op": { type: "resolution", text: "The device is ready for operation now." },

      "rf_start_new_service": { type: "question", text: "Starting a new service. <br><br> Have you informed CS about starting the new service?", yesNext: "rf_id_number_req", noNext: "rf_service_details_req" },
      "rf_service_details_req": { type: "resolution", text: "I need the following service details: Service Name and Operation Time. We will check with your account manager and get back to you." },

      "rf_check_operation": { type: "question", text: "Please let me know the Device ID, and we will check its operation type. <br><br> What is the operation type of this device?", yesText: "RFID Only", yesNext: "rf_check_hw_team", noText: "Time/Card-Time/No Card", noNext: "rf_other_ops" },
      "rf_check_hw_team": { type: "question", text: "What is the card number? <br><br> Check the card number with the hardware team. <br><br> Is the card number configured on the device?", yesNext: "rf_restart_now", noNext: "rf_not_in_system" },
      "rf_not_in_system": { type: "question", text: "The card number is not in the system. <br><br> Please let me know the Device ID and the RFID card number. <br><br> CS: Please inform the hardware team to update the RFID card number.", yesNext: "rf_id_number_req", noNext: "rf_id_number_req" },
      
      "rf_other_ops": { type: "question", text: "Is the operation type: <br><br> Time based? <br> Card-Time based? <br> No card?", yesText: "Time / No Card", yesNext: "rf_auto_trigger", noText: "Card-Time Based", noNext: "rf_ct_schedule" },
      "rf_auto_trigger": { type: "resolution", text: "There is no need to tap the card. The machine will automatically trigger the service." },
      "rf_ct_schedule": { type: "question", text: "The device is set to operate within a certain time window. You need to follow that schedule when tapping the card. <br><br> Do you want to change the operation time?", yesNext: "rf_cs_time_hw", noNext: "rf_use_allocated" },
      "rf_cs_time_hw": { type: "resolution", text: "CS: Please get the time and inform the hardware team." },
      "rf_use_allocated": { type: "resolution", text: "Please use the device based on the allocated time." },

      "rf_check_no": { type: "question", text: "No. <br><br> What is the LED status now?", yesText: "Solid Green", yesNext: "rf_press_green_move", noText: "No light / Blinking Red", noNext: "rf_cont_flash" },
      "rf_press_green_move": { type: "question", text: "Solid Green. <br><br> Please press the green button. <br><br> Did the weight bucket move?", yesNext: "rf_flash_after_restart", noNext: "rf_restart_now" },
      "rf_flash_after_restart": { type: "question", text: "Did the device flash green after restarting?", yesNext: "rf_tap_card_now", noNext: "rf_led_condition" },
      "rf_tap_card_now": { type: "question", text: "Yes. <br><br> Please tap the card now. <br><br> Did the LED change from flashing to solid green?", yesNext: "rf_ready_op", noNext: "rf_tap_diff" },

      /* PREVIOUS SHARED LOGIC - RETAINED FULLY */
      "data_start": { type: "question", text: "When was last data received?", yesText: "Yesterday", yesNext: "d_used_today", noText: "1 Week Ago", noNext: "power_start" },
      "d_used_today": { type: "question", text: "Did client use device today?", yesNext: "d_wait_hour", noNext: "tech_support_res" },
      "d_wait_hour": { type: "question", text: "Please ask client to leave device on for 1 hour. Data received now?", yesNext: "d_slow_net", noNext: "tech_support_res" },
      "d_slow_net": { type: "resolution", text: "The data uploaded late because of a slow network connection. Ask client to leave device on for 30 mins after service." },
      "power_start": { type: "question", text: "Is the charger plugged in and showing RED?", yesNext: "p_id_check", noNext: "tech_support_res" },
      "p_id_check": { type: "question", text: "Is ID V0501?", yesNext: "p_boot_wait", noNext: "p_boot_wait" },
      "p_boot_wait": { type: "question", text: "Restart and wait 1 min. LED Flashing Green?", yesNext: "d_resolved", noNext: "led_start" },
      "led_start": { type: "question", text: "Is the weight bucket attached?", yesNext: "l_clear_food", noNext: "l_attach_res" },
      "l_clear_food": { type: "question", text: "Is there food in bucket?", yesNext: "l_clear_res", noNext: "tech_support_res" },
      "l_attach_res": { type: "resolution", text: "Resolution:<br>Attach bucket and restart device." },
      "l_clear_res": { type: "resolution", text: "Resolution:<br>Clear food waste and restart." },
      "d_resolved": { type: "resolution", text: "Success! The device is now ready for use." },
      "tech_support_res": { type: "resolution", text: "Resolution:<br>Escalate to technical team. Please provide contact details and availability." }
    };

    let currentNode = ""; 
    let history = []; 

    function startDiagnostic(startNodeId) {
      document.getElementById("menu-screen").style.display = "none"; 
      document.getElementById("diagnostic-screen").style.display = "flex"; 
      currentNode = startNodeId; 
      history = []; 
      updateScreen(); 
    }

    function goToMenu() {
      document.getElementById("menu-screen").style.display = "block"; 
      document.getElementById("diagnostic-screen").style.display = "none"; 
      document.getElementById("searchBar").value = ""; 
      filterIssues(); 
    }

    function updateScreen() {
      const node = logicTree[currentNode]; 
      const textBox = document.getElementById("display-text"); 
      const yesNoArea = document.getElementById("yes-no-area"); 
      const backBtn = document.getElementById("back-btn");
      const yesBtn = document.getElementById("yes-btn");
      const noBtn = document.getElementById("no-btn");

      textBox.innerHTML = node.text; 
      yesBtn.innerText = node.yesText || "Yes";
      noBtn.innerText = node.noText || "No";
      backBtn.style.visibility = (history.length > 0) ? "visible" : "hidden";

      if (node.type === "resolution") {
        textBox.style.borderColor = "#28a745"; 
        textBox.style.color = "#28a745";
        yesNoArea.style.display = "none";      
      } else {
        textBox.style.borderColor = "#004085";
        textBox.style.color = "#333";
        yesNoArea.style.display = "block";     
      }
    }

    function makeChoice(answer) {
      history.push(currentNode); 
      currentNode = answer === 'Yes' ? logicTree[currentNode].yesNext : logicTree[currentNode].noNext; 
      updateScreen(); 
    }

    function goBack() {
      if (history.length > 0) {
        currentNode = history.pop(); 
        updateScreen();
      }
    }

    function filterIssues() {
      const input = document.getElementById('searchBar').value.toLowerCase(); 
      const buttons = document.getElementById('issue-list').getElementsByTagName('button'); 
      for (let i = 0; i < buttons.length; i++) {
        const btnText = buttons[i].innerText.toLowerCase(); 
        buttons[i].style.display = btnText.includes(input) ? "block" : "none";
      }
    }
  </script>
</body>
</html>
